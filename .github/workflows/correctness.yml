name: Correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-browser-engine
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-base
          path: luce-base
      # every dependency at main, beside this checkout (luce-base docs/CI.md)
      - name: Check out dependencies at main
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          python3 luce-base/tools/checkout_main.py luce-browser-engine
      - name: Select Clang
        run: |
          mkdir -p "$RUNNER_TEMP/luce-bin"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/luce-bin/cc"
          echo "$RUNNER_TEMP/luce-bin" >> "$GITHUB_PATH"
      - run: cd luce-base && ./build.sh
      - run: echo "$GITHUB_WORKSPACE/luce-base/build" >> "$GITHUB_PATH"
      - run: ./test.sh
        working-directory: luce-browser-engine
      # A test that crashes only on CI leaves its evidence here: web_test's actual/expected/diff
      # images and, on macOS, the crash reports of worker processes stopped by a signal.
      - name: Keep the web_test results and crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web_test-${{ matrix.runner }}
          path: |
            luce-browser-engine/build/web_test_results
            ~/Library/Logs/DiagnosticReports/web_test*
          if-no-files-found: ignore
          retention-days: 7
